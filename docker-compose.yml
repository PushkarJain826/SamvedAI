services:
  db:
    image: pgvector/pgvector:pg16
    container_name: samvedai-db

    environment:
      POSTGRES_DB: samvedai
      POSTGRES_USER: samvedai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: